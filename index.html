<!DOCTYPE html>
<html lang="en" data-mood="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05070c" media="(prefers-color-scheme: dark)">
<title>Stock Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.3.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* ===== Theme: "Midnight desk". Dark is the main look; light follows the phone setting. ===== */
:root {
  color-scheme: light;
  --bg: #f3f4f7;
  --surface: #ffffff;
  --surface2: #eceef2;
  --hair: rgba(15, 20, 30, 0.08);
  --text: #0b0d12;
  --text2: #5a6271;
  --text3: #8c93a1;
  --up: #0a8a3a;
  --down: #d3362f;
  --amber: #b86e00;
  --up-mark: #1faa55;
  --down-mark: #e2483f;
  --amber-mark: #f0a020;
  --grey-mark: #b4b9c3;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --div-sb: #256abf; --div-b: #86b6ef; --div-h: #d4d6db; --div-s: #ec9a96; --div-ss: #d03b3b;
  --glass-tint: rgba(255, 255, 255, 0.62);
  --glass-edge: rgba(255, 255, 255, 0.95);
  --glass-line: rgba(15, 20, 30, 0.06);
  --shadow: 0 10px 30px rgba(20, 25, 40, 0.10);
  --aurora-alpha: 0.30;
  --serif: "Instrument Serif", ui-serif, "New York", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --radius: 22px;
  --p: 0;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #05070c;
    --surface: rgba(255, 255, 255, 0.055);
    --surface2: rgba(255, 255, 255, 0.09);
    --hair: rgba(255, 255, 255, 0.07);
    --text: rgba(255, 255, 255, 0.93);
    --text2: #8f97a8;
    --text3: #5f6779;
    --up: #3ddc84;
    --down: #ff6259;
    --amber: #ffb547;
    --up-mark: #2fc26f;
    --down-mark: #ef5048;
    --amber-mark: #f5a524;
    --grey-mark: #4a5161;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --div-sb: #3987e5; --div-b: #1c5cab; --div-h: #383835; --div-s: #9b3a36; --div-ss: #e66767;
    --glass-tint: rgba(22, 26, 36, 0.55);
    --glass-edge: rgba(255, 255, 255, 0.22);
    --glass-line: rgba(255, 255, 255, 0.06);
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    --aurora-alpha: 0.42;
  }
}
html[data-mood="positive"] { --mood: var(--up-mark); }
html[data-mood="negative"] { --mood: var(--down-mark); }
html[data-mood="neutral"]  { --mood: var(--amber-mark); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: 16px; line-height: 1.42; -webkit-font-smoothing: antialiased;
  min-height: 100vh; overflow-x: hidden;
}
.num, .tab-num { font-variant-numeric: tabular-nums; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 3px; border-radius: 8px; }
[hidden] { display: none !important; }

/* ===== The mood glow (our own flavour) ===== */
.aurora { position: fixed; inset: -20vh -20vw; z-index: 0; pointer-events: none; will-change: transform; }
.aurora i {
  position: absolute; border-radius: 50%; opacity: var(--aurora-alpha);
  background: radial-gradient(circle at center, var(--mood) 0%, transparent 62%);
  transition: background 1.2s ease;
}
.aurora i:nth-child(1) { width: 90vw; height: 90vw; max-width: 720px; max-height: 720px; left: 10vw; top: 6vh; animation: drift1 22s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { width: 70vw; height: 70vw; max-width: 560px; max-height: 560px; right: 8vw; top: 26vh; opacity: calc(var(--aurora-alpha) * 0.7); animation: drift2 28s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { width: 60vw; height: 60vw; max-width: 480px; max-height: 480px; left: 30vw; top: 70vh; opacity: calc(var(--aurora-alpha) * 0.35); background: radial-gradient(circle, var(--s1) 0%, transparent 62%); animation: drift1 34s ease-in-out infinite alternate-reverse; }
@keyframes drift1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(12vw, 6vh) scale(1.15); } }
@keyframes drift2 { from { transform: translate(0, 0) scale(1.1); } to { transform: translate(-14vw, -4vh) scale(0.95); } }

/* ===== Liquid Glass ===== */
.glass {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.0) 60%),
    linear-gradient(0deg, color-mix(in oklab, var(--mood) 9%, transparent), color-mix(in oklab, var(--mood) 9%, transparent)),
    var(--glass-tint);
  -webkit-backdrop-filter: blur(28px) saturate(185%);
  backdrop-filter: blur(28px) saturate(185%);
  box-shadow:
    inset 0 1px 0 var(--glass-edge),
    inset 0 0 0 1px var(--glass-line),
    inset 0 -18px 30px -18px rgba(255, 255, 255, 0.10),
    var(--shadow);
}

/* ===== Top bar ===== */
.topbar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 30;
  padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-radius: 0 0 22px 22px;
  transition: opacity 0.3s ease;
}
.topbar .bar-bg { position: absolute; inset: 0; border-radius: inherit; opacity: calc(var(--p) * 1); pointer-events: none; }
.topbar > :not(.bar-bg) { position: relative; }
.mini { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mini img { width: 26px; height: 26px; border-radius: 8px; background: #fff; object-fit: contain; }
.mini .t { font-weight: 700; letter-spacing: -0.01em; font-size: 16px; }
.mini .mp { font-weight: 600; font-size: 15px; opacity: var(--p); transform: translateY(calc((1 - var(--p)) * 6px)); white-space: nowrap; }
.fresh { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); white-space: nowrap; }
.fresh .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--grey-mark); }
.fresh .dot.live { background: var(--up-mark); box-shadow: 0 0 0 0 var(--up-mark); animation: pulse 2.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--up-mark) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.picker { display: flex; gap: 6px; }
.picker button { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--surface2); min-height: 32px; }
.picker button.on { background: var(--text); color: var(--bg); }

/* ===== Pages ===== */
main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 58px) 16px calc(env(safe-area-inset-bottom) + 120px); }
.page { display: none; }
.page.active { display: block; }
.large-title { font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: -0.01em; margin: 6px 4px 16px; }
.large-title em { font-style: italic; color: var(--text2); }
.section-label { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text2); margin: 26px 6px 10px; }

.card { background: var(--surface); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; position: relative; overflow: hidden; }
html:not(.dark) .card { box-shadow: 0 1px 2px rgba(15, 20, 30, 0.04), 0 6px 20px rgba(15, 20, 30, 0.04); }
.card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.card .sub { color: var(--text2); font-size: 14px; margin: 0 0 14px; }
.card .what { color: var(--text3); font-size: 13px; margin: 12px 0 0; }
.muted { color: var(--text2); }
.small { font-size: 13px; }
.serif { font-family: var(--serif); font-weight: 400; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--text2); }

/* ===== Hero ===== */
.hero { border-radius: 28px; padding: 20px 20px 18px; margin-bottom: 12px; position: relative; overflow: hidden; transform-origin: 50% 0; }
.hero .who { display: flex; align-items: center; gap: 10px; }
.hero .who img { width: 36px; height: 36px; border-radius: 10px; background: #fff; object-fit: contain; }
.hero .who b { display: block; font-size: 16px; }
.hero .who span { display: block; font-size: 13px; color: var(--text2); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 650; padding: 4px 9px; border-radius: 999px; background: var(--surface2); color: var(--text2); white-space: nowrap; }
.chip.live { color: var(--up); }
.chip .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.hero .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.price { font-size: 64px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; margin: 18px 0 6px; display: flex; transform: scale(calc(1 - var(--p) * 0.18)); transform-origin: 0 50%; opacity: calc(1 - var(--p) * 0.6); }
.odo-col { display: inline-block; height: 1em; overflow: hidden; vertical-align: top; }
.odo-strip { display: flex; flex-direction: column; transition: transform 1.4s cubic-bezier(0.16, 1, 0.3, 1); }
.odo-strip span, .odo-ch { display: block; height: 1em; line-height: 1; }
.odo-ch { display: inline-block; }
.change { font-size: 17px; font-weight: 650; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.change .when { color: var(--text2); font-weight: 500; font-size: 14px; }
.mood-line { margin-top: 18px; display: flex; align-items: center; gap: 10px; }
.mood-word { font-family: var(--serif); font-size: 30px; line-height: 1.05; }
.mood-word i { font-style: italic; }
.mood-orb { width: 12px; height: 12px; border-radius: 50%; background: var(--mood); box-shadow: 0 0 18px 4px color-mix(in oklab, var(--mood) 55%, transparent); flex: none; }
.spark { margin-top: 14px; height: 56px; }
.spark svg { width: 100%; height: 56px; display: block; overflow: visible; }
.vs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ===== Lists and rows ===== */
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-top: 1px solid var(--hair); }
.row:first-child { border-top: 0; padding-top: 2px; }
.row .k { color: var(--text2); font-size: 15px; }
.row .v { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface2); border-radius: 16px; padding: 12px 14px; min-height: 76px; }
.tile .l { font-size: 12px; color: var(--text2); font-weight: 600; letter-spacing: 0.02em; }
.tile .n { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .x { font-size: 12px; color: var(--text3); margin-top: 2px; }

/* ===== Stories ===== */
.story { padding: 14px 0; border-top: 1px solid var(--hair); }
.story:first-child { border-top: 0; padding-top: 2px; }
.story .h { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; min-height: 44px; }
.story .bullet { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; flex: none; }
.bullet.positive { background: var(--up-mark); } .bullet.negative { background: var(--down-mark); } .bullet.neutral { background: var(--grey-mark); }
.story .tt { font-size: 16px; font-weight: 620; letter-spacing: -0.01em; line-height: 1.3; }
.story .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 6px; color: var(--text2); font-size: 13px; }
.imp { display: inline-flex; gap: 2px; align-items: center; }
.imp i { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); opacity: 0.4; }
.imp i.on { opacity: 1; background: var(--text); }
.tag { font-size: 12px; font-weight: 650; padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--text2); }
.tag.positive { color: var(--up); } .tag.negative { color: var(--down); }
.story .more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
.story.open .more { grid-template-rows: 1fr; }
.story .more > div { overflow: hidden; }
.story .sum { margin: 12px 0 8px 22px; color: var(--text); font-size: 15px; }
.srcs { margin: 0 0 0 22px; padding: 0; list-style: none; }
.srcs li a { display: block; padding: 10px 12px; margin-top: 6px; border-radius: 14px; background: var(--surface2); text-decoration: none; min-height: 44px; }
.srcs li a b { display: block; font-size: 14px; font-weight: 600; line-height: 1.3; }
.srcs li a span { display: block; font-size: 12px; color: var(--text2); margin-top: 2px; }
.chev { margin-left: auto; color: var(--text3); transition: transform 0.35s ease; flex: none; margin-top: 4px; }
.story.open .chev { transform: rotate(90deg); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -16px 6px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; min-height: 38px; color: var(--text2); }
.chips button.on { background: var(--text); color: var(--bg); }
.moodbar { display: flex; gap: 2px; height: 10px; border-radius: 6px; overflow: hidden; margin: 6px 0 10px; }
.moodbar span { display: block; height: 100%; transform-origin: 0 50%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* ===== Brief ===== */
.brief-head { font-family: var(--serif); font-size: 27px; line-height: 1.12; margin: 2px 0 12px; }
.sent { display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 0 -12px; border-radius: 14px; font-size: 16px; line-height: 1.45; }
.sent.link { cursor: pointer; }
.sent.link:active { background: var(--surface2); }
.sent .go { color: var(--s1); font-size: 13px; font-weight: 600; white-space: nowrap; }

/* ===== Outlook ===== */
.advice { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 650; color: var(--text2); padding: 5px 10px; border-radius: 999px; background: var(--surface); margin: 0 4px 14px; }
.summary { font-family: var(--serif); font-size: 24px; line-height: 1.22; }
.np { padding: 14px 0; border-top: 1px solid var(--hair); }
.np:first-child { border-top: 0; padding-top: 2px; }
.np .chips2 { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.driver { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--hair); align-items: flex-start; }
.driver:first-child { border-top: 0; padding-top: 2px; }
.ddot { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; }
.ddot.improving { background: var(--up-mark); box-shadow: 0 0 14px color-mix(in oklab, var(--up-mark) 50%, transparent); }
.ddot.worsening { background: var(--down-mark); box-shadow: 0 0 14px color-mix(in oklab, var(--down-mark) 50%, transparent); }
.ddot.steady { background: var(--grey-mark); }
.ddot.unscored { background: transparent; border: 2px dashed var(--grey-mark); }
.driver b { display: block; font-size: 15px; }
.driver span { display: block; font-size: 14px; color: var(--text2); margin-top: 2px; }
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--hair); border-radius: 2px; }
.ev { position: relative; padding: 0 0 16px; }
.ev:last-child { padding-bottom: 0; }
.ev::before { content: ""; position: absolute; left: -21px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--text3); }
.ev.soon::before { border-color: var(--mood); background: var(--mood); box-shadow: 0 0 12px var(--mood); }
.ev b { font-size: 15px; }
.ev .when { font-size: 13px; color: var(--text2); }
.ev .why { font-size: 14px; color: var(--text2); margin-top: 2px; }
.watch ul { margin: 0; padding-left: 18px; }
.watch li { margin: 6px 0; font-size: 15px; }
.twocol { display: grid; grid-template-columns: 1fr; gap: 12px; }

/* ===== Charts ===== */
.chart-host { position: relative; height: 240px; margin: 0 -6px; }
.chart-host.short { height: 200px; }
.seg { display: inline-flex; background: var(--surface2); border-radius: 12px; padding: 3px; gap: 2px; margin-bottom: 12px; }
.seg button { font-size: 13px; font-weight: 650; padding: 7px 12px; border-radius: 9px; color: var(--text2); min-height: 34px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); }
html.dark .seg button.on { background: rgba(255, 255, 255, 0.16); }
.readout { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--text2); min-height: 22px; margin-bottom: 4px; }
.readout b { color: var(--text); font-size: 17px; }
svg.viz { width: 100%; display: block; overflow: visible; }
svg.viz text { fill: var(--text2); font-size: 11px; font-family: var(--sans); }
svg.viz .grid { stroke: var(--hair); stroke-width: 1; }
svg.viz .lbl { fill: var(--text); font-weight: 650; }
.range52 { position: relative; height: 10px; border-radius: 6px; background: linear-gradient(90deg, var(--down-mark), var(--amber-mark), var(--up-mark)); opacity: 0.9; margin: 44px 0 8px; }
.range52 .pin { position: absolute; top: -8px; width: 4px; height: 26px; margin-left: -2px; border-radius: 3px; background: var(--text); box-shadow: 0 0 0 2px var(--bg); }
.range52 .pinlbl { position: absolute; top: -30px; transform: translateX(-50%); font-size: 13px; font-weight: 700; white-space: nowrap; }
.ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--text2); }
.building { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface2); font-size: 14px; color: var(--text2); }
.building .ring { width: 28px; height: 28px; flex: none; }
.heat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.heat div { border-radius: 14px; padding: 10px 12px; min-height: 64px; }
.heat b { display: block; font-size: 14px; }
.heat span { display: block; font-size: 15px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.heat small { display: block; font-size: 12px; color: var(--text2); }
.tip { position: fixed; z-index: 60; pointer-events: none; padding: 7px 10px; border-radius: 12px; font-size: 13px; line-height: 1.35; max-width: 240px; opacity: 0; transform: translateY(4px); transition: opacity 0.15s, transform 0.15s; }
.tip.show { opacity: 1; transform: none; pointer-events: auto; }
.lw-fallback { font-size: 14px; color: var(--text2); padding: 20px 0; }

/* ===== My plan ===== */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form label { display: grid; gap: 4px; font-size: 12px; font-weight: 650; color: var(--text2); }
.form label.full { grid-column: 1 / -1; }
input, textarea {
  font: inherit; font-size: 16px; color: var(--text); background: var(--surface2); border: 0; border-radius: 12px;
  padding: 11px 12px; width: 100%; min-height: 44px; -webkit-appearance: none; appearance: none;
}
textarea { min-height: 110px; resize: vertical; line-height: 1.45; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 14px; font-weight: 700; background: var(--text); color: var(--bg); width: 100%; margin-top: 12px; }
.btn:active { transform: scale(0.98); }
.del { font-size: 13px; font-weight: 600; color: var(--down); padding: 8px 4px 8px 12px; min-height: 36px; }
.scen { display: grid; grid-template-columns: 60px 1fr 1fr; gap: 8px; align-items: center; margin-top: 8px; }
.scen span { font-weight: 650; font-size: 15px; }
.big-num { font-size: 40px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.05; font-variant-numeric: tabular-nums; }

/* ===== Dock (floating tab bar) ===== */
.dock {
  position: fixed; z-index: 40; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 12px);
  transform: translateX(-50%); display: flex; gap: 2px; padding: 6px; border-radius: 30px;
  transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.2, 1), padding 0.45s cubic-bezier(0.2, 0.9, 0.2, 1);
  width: min(calc(100vw - 24px), 440px);
}
.dock button { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 24px; color: var(--text2); min-height: 52px; position: relative; transition: color 0.25s; }
.dock button svg { width: 24px; height: 24px; }
.dock button span { font-size: 10.5px; font-weight: 650; letter-spacing: 0.01em; transition: opacity 0.3s, height 0.3s; }
.dock button[aria-current="page"] { color: var(--text); }
.dock .pill { position: absolute; top: 6px; bottom: 6px; left: 6px; border-radius: 24px; background: var(--surface2); transition: transform 0.5s cubic-bezier(0.3, 1.4, 0.4, 1), width 0.5s; z-index: -1; }
html.dark .dock .pill { background: rgba(255, 255, 255, 0.12); }
.dock.small { transform: translateX(-50%) scale(0.9); padding: 4px; }
.dock.small button span { opacity: 0; height: 0; }
.dock.small button { min-height: 44px; padding: 9px 0; }

/* ===== Pull to refresh, skeleton, errors ===== */
.ptr { position: fixed; z-index: 35; left: 50%; top: calc(env(safe-area-inset-top) + 56px); width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; display: grid; place-items: center; opacity: 0; transform: translateY(-30px); pointer-events: none; }
.ptr svg { width: 18px; height: 18px; }
.ptr.spin svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel { background: linear-gradient(90deg, var(--surface) 0%, var(--surface2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius); margin-bottom: 12px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.note { font-size: 13px; color: var(--text2); text-align: center; margin: 22px 10px 0; }
.empty { color: var(--text2); font-size: 15px; }

@media (prefers-reduced-motion: reduce) {
  .aurora i, .fresh .dot.live, .skel { animation: none !important; }
  .odo-strip, .story .more, .dock, .dock .pill, .chev { transition: none !important; }
  .price { transform: none; opacity: 1; }
}
</style>
</head>
<body>
<div class="aurora" id="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="ptr glass" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></div>

<main id="main">
  <section class="page active" id="page-today" data-tab="today" aria-label="Today">
    <div id="today"><div class="skel" style="height:330px"></div><div class="skel" style="height:120px"></div><div class="skel" style="height:220px"></div></div>

</main>

<nav class="dock glass" id="dock" aria-label="Tabs">
  <div class="pill" id="pill"></div>
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></button>
  <button data-tab="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h10M7 17h6"/></svg><span>News</span></button>
  <button data-tab="outlook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Outlook</span></button>
  <button data-tab="numbers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Numbers</span></button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg><span>My plan</span></button>
</nav>

<div class="tip glass" id="tip" role="status"></div>

<script defer>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";

  /* ================= Basics ================= */
  var TABS = ["today", "news", "outlook", "numbers", "plan"];
  var TOPIC_NAMES = { demand: "Demand", competition: "Competition", regulation: "Regulation", leadership: "Leadership",
    supply_chain: "Supply chain", earnings: "Earnings", valuation: "Valuation", macro: "Economy", product: "Products", other: "Other" };
  var IMPACT_NAMES = { positive: "Good news", negative: "Bad news", neutral: "Neutral" };
  var HOURS = { amc: "after the US close", bmo: "before the US open", dmh: "during US trading hours" };
  var HOURS_HK = { amc: "early next morning in Hong Kong", bmo: "evening in Hong Kong", dmh: "late evening in Hong Kong" };
  var BENCH_FALLBACK = { QQQ: "Nasdaq 100 fund", SOXX: "Chip sector fund", SPY: "S&P 500 fund" };
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  var darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
  var S = { companies: [], ticker: null, d: null, tab: "today", baseline: null, range: "3M", topic: "all",
            scroll: {}, charts: [], built: {}, loading: false };

  function $(id) { return document.getElementById(id); }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? esc(u) : null; }
  function fmt(v, d) { return isNum(v) ? v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) : ""; }
  function money(v, d) { if (!isNum(v)) return ""; var s = "$" + fmt(Math.abs(v), d == null ? 2 : d); return v < 0 ? "-" + s : s; }
  function bigMoney(v) {
    if (!isNum(v)) return "";
    var a = Math.abs(v), s;
    if (a >= 1e12) s = fmt(a / 1e12, 2) + "T"; else if (a >= 1e9) s = fmt(a / 1e9, 1) + "B";
    else if (a >= 1e6) s = fmt(a / 1e6, 0) + "M"; else s = fmt(a, 0);
    return (v < 0 ? "-$" : "$") + s;
  }
  function pct(v, d, noSign) { if (!isNum(v)) return ""; return (!noSign && v > 0 ? "+" : "") + fmt(v, d == null ? 2 : d) + "%"; }
  function dir(v) { return !isNum(v) || v === 0 ? "flat" : v > 0 ? "up" : "down"; }
  function arrow(v) { return !isNum(v) || v === 0 ? "" : v > 0 ? "▲ " : "▼ "; }
  function parseDate(s) { if (!s) return null; var d = new Date(s.length === 10 ? s + "T00:00:00Z" : s); return isNaN(d) ? null : d; }
  function hkt(iso, opts) {
    var d = parseDate(iso); if (!d) return "";
    return d.toLocaleString("en-GB", Object.assign({ timeZone: "Asia/Hong_Kong" }, opts || { hour: "2-digit", minute: "2-digit", hour12: false }));
  }
  function dayName(dateStr) { var d = parseDate(dateStr); return d ? d.toLocaleDateString("en-GB", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short" }) : ""; }
  function todayHK() { return new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Hong_Kong" }); }
  function daysUntil(dateStr) {
    var a = parseDate(todayHK()), b = parseDate(dateStr);
    return a && b ? Math.round((b - a) / 86400000) : null;
  }
  function ago(iso) {
    var d = parseDate(iso); if (!d) return "";
    var m = Math.round((Date.now() - d) / 60000);
    if (m < 1) return "just now"; if (m < 60) return m + "m ago";
    var h = Math.round(m / 60); if (h < 24) return h + "h ago";
    var dd = Math.round(h / 24); return dd + (dd === 1 ? " day ago" : " days ago");
  }
  function store(key, value) {
    try {
      if (value === undefined) return JSON.parse(localStorage.getItem(key) || "null");
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) { return null; }
    return null;
  }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function motionOK() { return !reduceMotion.matches && !!window.gsap; }
  function fyLabel(fyEnd) {
    var d = parseDate(fyEnd); if (!d) return { short: "", long: "" };
    var y = d.getUTCFullYear(), mon = d.toLocaleDateString("en-GB", { timeZone: "UTC", month: "short" });
    return { short: "FY" + String(y).slice(2), long: "Year to " + mon + " " + y };
  }
  function card(inner, cls) { return '<div class="card reveal' + (cls ? " " + cls : "") + '">' + inner + "</div>"; }
  function building(days, need, what) {
    var frac = Math.min(1, days / need), c = 2 * Math.PI * 11;
    return '<div class="building"><svg class="ring" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="var(--hair)" stroke-width="3"/>' +
      '<circle cx="14" cy="14" r="11" fill="none" stroke="var(--mood)" stroke-width="3" stroke-linecap="round" transform="rotate(-90 14 14)" stroke-dasharray="' +
      (c * frac).toFixed(1) + " " + c.toFixed(1) + '"/></svg><span>' + esc(what) + " is building up: " + days + (days === 1 ? " day" : " days") +
      " so far. The line appears after " + need + " days.</span></div>";
  }

  document.documentElement.classList.toggle("dark", darkQuery.matches);

  /* ================= Tooltip ================= */
  var tip = $("tip"), tipTimer = null;
  function showTip(html, x, y) {
    tip.innerHTML = html; tip.classList.add("show");
    var r = tip.getBoundingClientRect();
    var left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2));
    var top = y - r.height - 14; if (top < 60) top = y + 18;
    tip.style.left = left + "px"; tip.style.top = top + "px";
    clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 3200);
  }
  function hideTip() { tip.classList.remove("show"); }
  document.addEventListener("pointerover", function (e) {
    var t = e.target.closest && e.target.closest("[data-tip]");
    if (t && e.pointerType === "mouse") showTip(t.getAttribute("data-tip"), e.clientX, e.clientY);
  });
  document.addEventListener("pointerout", function (e) { if (e.pointerType === "mouse" && e.target.closest && e.target.closest("[data-tip]")) hideTip(); });
  document.addEventListener("pointerdown", function (e) {
    var t = e.target.closest && e.target.closest("[data-tip]");
    if (t) showTip(t.getAttribute("data-tip"), e.clientX, e.clientY); else hideTip();
  });
  window.addEventListener("scroll", hideTip, { passive: true });

  /* ================= SVG chart helpers ================= */
  function lineChart(series, o) {
    o = o || {};
    var W = 320, H = o.height || 170, m = { l: 34, r: o.right || 56, t: 10, b: 22 };
    var all = []; series.forEach(function (s) { s.points.forEach(function (p) { if (isNum(p.y)) all.push(p.y); }); });
    if (!all.length) return "";
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all), pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.05 || 1;
    lo -= pad; hi += pad;
    var n = series[0].points.length;
    var x = function (i) { return m.l + (n === 1 ? 0.5 : i / (n - 1)) * (W - m.l - m.r); };
    var y = function (v) { return m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b); };
    var out = '<svg class="viz" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(o.label || "Line chart") + '">';
    for (var g = 0; g <= 3; g++) {
      var v = lo + (g / 3) * (hi - lo), yy = y(v);
      out += '<line class="grid" x1="' + m.l + '" x2="' + (W - m.r + 6) + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '"/>';
      out += '<text x="' + (m.l - 6) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end">' + esc(o.fmtY ? o.fmtY(v) : fmt(v, 0)) + "</text>";
    }
    var labels = series[0].points;
    out += '<text x="' + m.l + '" y="' + (H - 4) + '">' + esc(labels[0].x) + "</text>";
    out += '<text x="' + x(n - 1) + '" y="' + (H - 4) + '" text-anchor="end">' + esc(labels[n - 1].x) + "</text>";
    series.forEach(function (s) {
      var d = "", started = false;
      s.points.forEach(function (p, i) { if (!isNum(p.y)) return; d += (started ? "L" : "M") + x(i).toFixed(1) + "," + y(p.y).toFixed(1); started = true; });
      out += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pathLength="1" data-draw/>';
      var last = s.points[n - 1];
      if (isNum(last.y)) {
        out += '<circle cx="' + x(n - 1).toFixed(1) + '" cy="' + y(last.y).toFixed(1) + '" r="4" fill="' + s.color + '" stroke="var(--bg)" stroke-width="2" data-pop/>';
        out += '<text class="lbl" x="' + (x(n - 1) + 9).toFixed(1) + '" y="' + (s.labelY != null ? s.labelY : y(last.y) + 4).toFixed(1) + '" data-fade>' + esc(s.name + " " + (o.fmtLast ? o.fmtLast(last.y) : "")) + "</text>";
      }
    });
    var step = (W - m.l - m.r) / Math.max(1, n - 1);
    for (var i = 0; i < n; i++) {
      var tipHtml = "<b>" + esc(labels[i].x) + "</b>" + series.map(function (s) {
        return "<br>" + esc(s.name) + ": " + esc(o.fmtTip ? o.fmtTip(s.points[i].y) : fmt(s.points[i].y, 2));
      }).join("");
      out += '<rect x="' + (x(i) - step / 2).toFixed(1) + '" y="0" width="' + step.toFixed(1) + '" height="' + H + '" fill="transparent" data-tip="' + esc(tipHtml) + '"/>';
    }
    return out + "</svg>";
  }
  function spreadLabels(series, yOf) {
    var items = series.map(function (s) { var l = s.points[s.points.length - 1]; return { s: s, y: isNum(l.y) ? yOf(l.y) + 4 : null }; })
      .filter(function (t) { return t.y != null; }).sort(function (a, b) { return a.y - b.y; });
    for (var i = 1; i < items.length; i++) if (items[i].y - items[i - 1].y < 14) items[i].y = items[i - 1].y + 14;
    items.forEach(function (t) { t.s.labelY = t.y; });
  }

  /* ================= Odometer price ================= */
  function odometer(el, text) {
    var chars = text.split("");
    var same = el.dataset.layout === chars.map(function (c) { return /\d/.test(c) ? "d" : c; }).join("");
    if (!same) {
      var fromChars = (S.lastPriceText || "").split("");
      el.innerHTML = chars.map(function (c, idx) {
        if (!/\d/.test(c)) return '<span class="odo-ch">' + esc(c) + "</span>";
        var strip = ""; for (var i = 0; i < 10; i++) strip += "<span>" + i + "</span>";
        var fromDigit = fromChars && fromChars.length === chars.length && /\d/.test(fromChars[idx]) ? Number(fromChars[idx]) : 0;
        return '<span class="odo-col"><span class="odo-strip" style="transform:translateY(-' + fromDigit + 'em)">' + strip + "</span></span>";
      }).join("");
      el.dataset.layout = chars.map(function (c) { return /\d/.test(c) ? "d" : c; }).join("");
      el.setAttribute("aria-label", text);
    }
    var strips = el.querySelectorAll(".odo-strip"), k = 0;
    var apply = function () {
      k = 0;
      chars.forEach(function (c) { if (/\d/.test(c)) { strips[k].style.transform = "translateY(-" + Number(c) + "em)"; k++; } });
    };
    if (reduceMotion.matches || same) apply(); else requestAnimationFrame(function () { requestAnimationFrame(apply); });
  }

  /* ================= Rendering: Today ================= */
  function setMood(d) {
    var tone = (d.brief && d.brief.tone) || null;
    if (!tone) { var c = d.quote && d.quote.change_pct; tone = !isNum(c) ? "neutral" : c > 0.5 ? "positive" : c < -0.5 ? "negative" : "neutral"; }
    document.documentElement.setAttribute("data-mood", tone);
  }

  function marketChip(d) {
    var m = d.market || {};
    if (m.is_open) return '<span class="chip live"><span class="d"></span>Market open</span>';
    if (m.holiday) return '<span class="chip">Holiday: ' + esc(m.holiday) + "</span>";
    return '<span class="chip"><span class="d"></span>Market closed</span>';
  }

  function sparkline(d) {
    var rows = ((d.history || {}).company || []).slice(-30).filter(function (r) { return isNum(r.close); });
    if (rows.length < 5) return "";
    var W = 320, H = 56, vals = rows.map(function (r) { return r.close; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), rg = hi - lo || 1;
    var pts = vals.map(function (v, i) { return [(i / (vals.length - 1)) * W, H - 4 - ((v - lo) / rg) * (H - 8)]; });
    var line = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join("");
    var area = line + "L" + W + "," + H + "L0," + H + "Z";
    var col = vals[vals.length - 1] >= vals[0] ? "var(--up-mark)" : "var(--down-mark)";
    var change = (vals[vals.length - 1] / vals[0] - 1) * 100;
    return '<div class="spark"><svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-label="Price over the last 30 trading days">' +
      '<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + col + '" stop-opacity="0.35"/><stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + area + '" fill="url(#sg)" data-fade/><path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" vector-effect="non-scaling-stroke" pathLength="1" data-draw/></svg></div>' +
      '<div class="small muted" style="margin-top:4px">Last 30 trading days <span class="' + dir(change) + '">' + arrow(change) + pct(change, 1) + "</span></div>";
  }

  function storyByKey(d, key) { return ((d.news || {}).stories || []).filter(function (s) { return s.key === key; })[0]; }

  function impBadge(level) {
    var n = level === "high" ? 3 : level === "medium" ? 2 : 1;
    return '<span class="imp" data-tip="' + esc((level || "low").replace(/^./, function (c) { return c.toUpperCase(); }) + " importance") + '">' +
      [1, 2, 3].map(function (i) { return '<i class="' + (i <= n ? "on" : "") + '"></i>'; }).join("") + "</span>";
  }

  function storyHtml(s, open, idPrefix) {
    var srcs = (s.sources || []).map(function (x) {
      var u = safeUrl(x.url);
      var inner = "<b>" + esc(x.headline || "Article") + "</b><span>" + esc(x.source || "") + (x.published ? " · " + esc(ago(x.published)) : "") + "</span>";
      return "<li>" + (u ? '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + inner + "</a>" : '<a>' + inner + "</a>") + "</li>";
    }).join("");
    var lead = (s.sources || [])[0] || {};
    return '<div class="story' + (open ? " open" : "") + '" id="' + (idPrefix || "story-") + esc(s.key) + '" data-topic="' + esc(s.topic || "other") + '">' +
      '<button class="h" data-toggle aria-expanded="' + (open ? "true" : "false") + '"><span class="bullet ' + esc(s.impact || "neutral") + '"></span><span>' +
      '<span class="tt">' + esc(s.title) + "</span>" +
      '<span class="meta"><span class="tag ' + esc(s.impact || "") + '">' + esc(IMPACT_NAMES[s.impact] || "Neutral") + "</span>" + impBadge(s.importance) +
      "<span>" + esc(lead.source || "") + (s.count > 1 ? " +" + (s.count - 1) + " more" : "") + "</span><span>" + esc(ago(s.latest)) + "</span></span></span>" +
      '<svg class="chev" width="10" height="16" viewBox="0 0 10 16"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '<div class="more"><div>' + (s.summary ? '<p class="sum">' + esc(s.summary) + "</p>" : "") + '<ul class="srcs">' + srcs + "</ul></div></div></div>";
  }

  function computeBaseline(d) {
    var key = "lastvisit:" + d.ticker, sessKey = "baseline:" + d.ticker, base = null;
    try { base = JSON.parse(sessionStorage.getItem(sessKey) || "null"); } catch (e) { base = null; }
    if (!base) {
      base = store(key) || { first: true };
      try { sessionStorage.setItem(sessKey, JSON.stringify(base)); } catch (e) { /* private mode */ }
    }
    store(key, { at: new Date().toISOString(), price: (d.quote || {}).price, stories: ((d.news || {}).stories || []).map(function (s) { return s.key; }) });
    return base;
  }

  function renderToday(d) {
    var q = d.quote || {}, p = d.profile || {}, b = d.brief, stories = ((d.news || {}).stories || []).slice();

    var html = "";

        : "Close, " + (parseDate(q.time) || new Date()).toLocaleDateString("en-GB", { timeZone: "America/New_York", weekday: "short", day: "numeric", month: "short" }) + " (US)";
    }
    var vs = Object.keys(d.benchmarks || {}).map(function (sym) {

      var name = (d.benchmark_names || {})[sym] || BENCH_FALLBACK[sym] || sym;
      return '<span class="chip" data-tip="' + esc(d.ticker + " moved " + fmt(Math.abs(r), 2) + " points " + (r >= 0 ? "better" : "worse") + " than the " + name + " today") + '">vs ' + esc(name) + ' <b class="' + dir(r) + '">' + (r > 0 ? "+" : "") + fmt(r, 2) + "</b></span>";
    }).join("");
    html += '<div class="hero glass reveal" id="hero">' +
      '<div class="top"><div class="who">' + (p.logo ? '<img src="' + safeUrl(p.logo) + '" alt="">' : "") + "<div><b>" + esc(d.name || p.name || d.ticker) + "</b><span>" + esc(d.ticker) + (p.industry ? " · " + esc(p.industry) : "") + "</span></div></div>" + marketChip(d) + "</div>" +
      (isNum(q.price) ? '<div class="price num" id="heroPrice"></div>' +
        '<div class="change num"><span class="' + dir(q.change) + '">' + arrow(q.change) + money(Math.abs(q.change)) + " (" + pct(Math.abs(q.change_pct), 2, true) + ')</span><span class="when">' + esc(quoteDay) + "</span></div>" : '<p class="empty">No price yet.</p>') +
      (b && b.mood ? '<div class="mood-line"><span class="mood-orb"></span><span class="mood-word">' + esc(b.mood).replace(/^(\S+)/, "<i>$1</i>") + "</span></div>" : "") +
      sparkline(d) + (vs ? '<div class="vs">' + vs + "</div>" : "") + "</div>";

    // Since you last looked
    var base = S.baseline;
    if (base && !base.first && base.at) {
      var fresh = stories.filter(function (s) { return (s.first_seen || "") > base.at; });
      var moved = isNum(base.price) && isNum(q.price) ? (q.price / base.price - 1) * 100 : null;
      html += card('<h3>Since you last looked</h3><p class="sub">' + esc(ago(base.at)) + ", " + esc(hkt(base.at, { weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false })) + " HKT</p>" +
        '<div class="tiles"><div class="tile"><div class="l">Price move</div><div class="n ' + dir(moved) + '">' + (isNum(moved) ? arrow(moved) + pct(Math.abs(moved), 2, true) : "None") + '</div><div class="x">' + (isNum(base.price) ? "from " + money(base.price) : "") + "</div></div>" +
        '<div class="tile"><div class="l">New stories</div><div class="n" data-count="' + fresh.length + '">' + fresh.length + '</div><div class="x">' + (fresh.length ? "tap one below" : "nothing new") + "</div></div></div>" +
        (fresh.length ? '<div style="margin-top:10px">' + fresh.slice(0, 3).map(function (s) {
          return '<button class="sent link" data-story="' + esc(s.key) + '"><span class="bullet ' + esc(s.impact) + '" style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px"></span>' + esc(s.title) + "</button>";
        }).join("") + "</div>" : ""));
    } else {
      html += card('<h3>Since you last looked</h3><p class="sub" style="margin:0">Welcome. From your next visit, this card shows the price move and any new stories since you last opened the app.</p>');
    }

    // Brief
    if (b && b.sentences && b.sentences.length) {
      html += card('<p class="section-label" style="margin:0 0 8px">The brief</p>' + (b.headline ? '<p class="brief-head">' + esc(b.headline) + "</p>" : "") +
        b.sentences.map(function (s) {
          var keys = (s.stories || []).filter(function (k) { return storyByKey(d, k); });
          return keys.length ? '<button class="sent link" data-story="' + esc(keys[0]) + '">' + esc(s.text) + ' <span class="go">' + (keys.length > 1 ? keys.length + " stories" : "Story") + " ›</span></button>"
            : '<span class="sent">' + esc(s.text) + "</span>";
        }).join("") + '<p class="what">Written by AI from the news and numbers ' + esc(ago(b.written_at)) + ". Analysis, not advice.</p>");
    }

    // Next up
    var next = (d.catalysts || []).filter(function (c) { return (c.date || "") >= todayHK(); })[0];
    if (next) {
      var dd = daysUntil(next.date), en = (d.earnings || {}).next;
      var isEarn = next.kind === "earnings" && en && en.date === next.date;
      html += card('<p class="section-label" style="margin:0 0 8px">Next up</p><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">' +
        '<div><div class="serif" style="font-size:28px;line-height:1.05">' + esc(next.label) + '</div><div class="muted small" style="margin-top:6px">' + esc(dayName(next.date)) +
        (isEarn && HOURS[en.hour] ? ", " + esc(HOURS[en.hour]) + " (" + esc(HOURS_HK[en.hour]) + ")" : next.approx ? " (about)" : "") + "</div></div>" +
        '<div style="text-align:right"><div class="big-num" data-count="' + (dd || 0) + '">' + (dd === 0 ? "Today" : esc(dd)) + '</div><div class="muted small">' + (dd === 0 ? "" : dd === 1 ? "day" : "days") + "</div></div></div>" +
        (isEarn ? '<div class="tiles" style="margin-top:14px">' + (isNum(en.epsEstimate) ? '<div class="tile"><div class="l">EPS estimate</div><div class="n">' + money(en.epsEstimate) + '</div><div class="x">per share, this quarter</div></div>' : "") +
          (isNum(en.revenueEstimate) ? '<div class="tile"><div class="l">Revenue estimate</div><div class="n">' + bigMoney(en.revenueEstimate) + '</div><div class="x">this quarter</div></div>' : "") + "</div>" : ""));
    }

    // Top stories
    if (stories.length) {
      html += '<p class="section-label">Top stories</p>' + card(stories.slice(0, 3).map(function (s) { return storyHtml(s, false, "top-"); }).join("") +
        '<button class="btn" data-goto="news" style="background:var(--surface2);color:var(--text)">All ' + stories.length + " stories</button>");
    }

    if ((d.errors || []).length) {
      html += '<p class="note">The last update had ' + d.errors.length + (d.errors.length === 1 ? " problem" : " problems") + ': ' + esc(d.errors.slice(0, 2).join(" | ")) + "</p>";
    }
    html += '<p class="note">' + esc(d.name || d.ticker) + " data updated " + esc(hkt(d.updated_at, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false })) + " HKT. For tracking and learning, not financial advice.</p>";
    var ab = d.ai_budget || {}, ud = (d.usage || {}).today || {};
    if (isNum(ab.used_today)) {
      html += '<p class="note">AI use today: ' + fmt(ab.used_today / 1000, 0) + "k tokens" +
        (isNum(ab.daily) ? " of a " + fmt(ab.daily / 1000, 0) + "k daily budget (" + fmt(ab.used_pct, 0) + "%)" : "") +
        ". The brief is only rewritten when the news or price changes" +
        (ud.filtered_headlines ? ", and " + fmt(ud.filtered_headlines, 0) + " off topic headlines were dropped before reaching the AI" : "") + ".</p>";
    }
    $("today").innerHTML = html;
    if (isNum(q.price) && $("heroPrice")) { odometer($("heroPrice"), money(q.price)); S.lastPriceText = money(q.price); }
  }

  /* ================= Rendering: News ================= */
  function renderNews(d) {
    var n = d.news || {}, stories = (n.stories || []).slice();
    stories.sort(function (a, c) { return (c.latest || "").localeCompare(a.latest || ""); });
    if (!stories.length) { $("news").innerHTML = card('<p class="empty">No stories in the last 7 days yet.</p>'); return; }
    var mood = n.mood_7d || {}, tot = (mood.positive || 0) + (mood.neutral || 0) + (mood.negative || 0);
    var html = "";
    if (tot) {
      var seg = function (k, col) { var v = mood[k] || 0; return v ? '<span style="width:' + (v / tot * 100) + '%;background:' + col + '" data-growx data-tip="' + esc(v + " " + IMPACT_NAMES[k].toLowerCase() + " articles") + '"></span>' : ""; };
      html += card("<h3>News mood, last 7 days</h3><p class=\"sub\">" + tot + " relevant articles sorted by AI</p>" +
        '<div class="moodbar">' + seg("positive", "var(--up-mark)") + seg("neutral", "var(--grey-mark)") + seg("negative", "var(--down-mark)") + "</div>" +
        '<div class="legend"><span><i style="background:var(--up-mark)"></i>Good ' + (mood.positive || 0) + '</span><span><i style="background:var(--grey-mark)"></i>Neutral ' + (mood.neutral || 0) +
        '</span><span><i style="background:var(--down-mark)"></i>Bad ' + (mood.negative || 0) + "</span></div>");
    }
    var topics = []; stories.forEach(function (s) { var t = s.topic || "other"; if (topics.indexOf(t) < 0) topics.push(t); });
    if (topics.length > 1) {
      html += '<div class="chips" id="topicChips"><button data-topic="all" class="' + (S.topic === "all" ? "on" : "") + '">All</button>' +
        topics.map(function (t) { return '<button data-topic="' + esc(t) + '" class="' + (S.topic === t ? "on" : "") + '">' + esc(TOPIC_NAMES[t] || t) + "</button>"; }).join("") + "</div>";
    }
    html += card('<div id="storyList">' + stories.map(function (s) { return storyHtml(s, false); }).join("") + "</div>");
    html += '<p class="note">Stories group articles about the same event. Tap one to see every source.</p>';
    $("news").innerHTML = html;
    applyTopic(false);
  }
  function applyTopic(animate) {
    var list = $("storyList"); if (!list) return;
    var shown = [];
    list.querySelectorAll(".story").forEach(function (el) {
      var ok = S.topic === "all" || el.getAttribute("data-topic") === S.topic;
      el.hidden = !ok; if (ok) shown.push(el);
    });
    shown.forEach(function (el, i) { el.style.borderTop = i === 0 ? "0" : ""; el.style.paddingTop = i === 0 ? "2px" : ""; });
    if (animate && motionOK()) gsap.fromTo(shown, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.05, ease: "power3.out" });
  }

  /* ================= Rendering: Outlook ================= */
  function renderOutlook(d) {

    if ((o.what_next || []).length) {
      var dirName = { positive: ["Positive", "up"], negative: ["Negative", "down"], mixed: ["Mixed", "flat"] };
      html += '<p class="section-label">What happens next</p>' + card(o.what_next.map(function (w) {
        var dn = dirName[w.direction] || dirName.mixed;
        return '<div class="np"><div style="font-size:16px">' + esc(w.point) + '</div><div class="chips2"><span class="tag ' + (w.direction === "positive" ? "positive" : w.direction === "negative" ? "negative" : "") + '">' +
          (w.direction === "positive" ? "▲ " : w.direction === "negative" ? "▼ " : "◆ ") + dn[0] + '</span><span class="tag">' + esc("Within " + (w.timeframe || "weeks")) +
          '</span><span class="tag">' + esc((w.confidence || "medium").replace(/^./, function (c) { return c.toUpperCase(); }) + " confidence") + "</span>" +
          ((w.stories || []).length ? '<button class="tag" data-story="' + esc(w.stories[0]) + '" style="color:var(--s1)">Story ›</button>' : "") + "</div></div>";
      }).join(""));
    }

    var rows = o.drivers || [], names = d.drivers || [];

          ' <span class="tag ' + (r.status === "improving" ? "positive" : r.status === "worsening" ? "negative" : "") + '" style="display:inline;margin-left:4px">' + esc(label[r.status] || "") + "</span></b><span>" + esc(r.reason || "") + "</span></div></div>";
      }).join("") : names.map(function (nm) {
        return '<div class="driver"><span class="ddot unscored"></span><div><b>' + esc(nm) + "</b><span>Scored at the next outlook update.</span></div></div>";
      }).join("");
      html += '<p class="section-label">Driver scorecard</p>' + card(body + '<p class="what">The things that decide whether the investment case holds. ▲ improving, ■ steady, ▼ worsening.</p>');
    }

    var cats = (d.catalysts || []).filter(function (c) { return (c.date || "") >= todayHK(); }).slice(0, 8);

        var dd = daysUntil(c.date);

        return '<div class="ev' + (dd != null && dd <= 7 ? " soon" : "") + '"><b>' + esc(c.label) + '</b> <span class="when">' + esc(dayName(c.date)) + (c.approx ? " (about)" : "") +
          (dd != null ? " · " + (dd === 0 ? "today" : "in " + dd + (dd === 1 ? " day" : " days")) : "") + "</span>" + (why ? '<div class="why">' + esc(why) + "</div>" : "") + "</div>";

  /* ================= Rendering: Numbers ================= */
  function renderNumbers(d) {
    var html = "", v = d.valuation || {}, an = d.analysts || {}, q = d.quote || {};

    // Price chart
    if (((d.history || {}).company || []).length > 5) {
      html += card('<h3>Price</h3><div class="seg" id="rangeSeg">' + ["1M", "3M", "6M", "1Y"].map(function (r) { return '<button data-range="' + r + '" class="' + (S.range === r ? "on" : "") + '">' + r + "</button>"; }).join("") +
        '</div><div class="readout" id="priceReadout"></div><div class="chart-host" id="priceChart"></div>' +
        ((d.major_events || []).length ? '<p class="what">Dots mark big news days. Tap one to see the story.</p>' : ""));
    }

    // Compare
    var bh = (d.history || {}).benchmarks || {}, bsyms = Object.keys(bh).filter(function (k) { return (bh[k] || []).length > 5; });
    if (bsyms.length) {

        '<div class="legend" id="cmpLegend"></div><div class="chart-host short" id="cmpChart" style="margin-top:8px"></div><p class="what" id="cmpNote"></p>');
    }

    // 52 week range
    var r52 = d.range_52w || {};
    if (isNum(r52.high) && isNum(r52.low) && isNum(q.price)) {
      var pos = Math.max(0, Math.min(100, r52.position_pct));

        '<div class="range52"><span class="pin" style="left:' + pos + '%" data-slide="' + pos + '"></span><span class="pinlbl num" style="left:' + pos + '%">' + money(q.price) + "</span></div>" +
        '<div class="ends num"><span>Low ' + money(r52.low) + "</span><span>High " + money(r52.high) + "</span></div>");
    }

    // Valuation tiles
    var tiles = [
      ["Forward P/E", v.forward_pe, "x", 1, "price ÷ next 12 months EPS (blend)"],
      ["P/E, last 12 months", v.pe_ttm, "x", 1, "price ÷ past 12 months EPS"],
      ["PEG", v.peg, "", 2, "P/E ÷ growth rate"],
      ["Free cash flow yield", v.fcf_yield_pct, "%", 2, "cash made ÷ market value"],
      ["EV to EBITDA", v.ev_ebitda, "x", 1, "value ÷ operating profit"],
      ["Market value", (d.profile || {}).market_cap_musd ? d.profile.market_cap_musd * 1e6 : null, "$", 0, "share price × shares"]
    ].filter(function (t) { return isNum(t[1]); });
    if (tiles.length) {
      html += card("<h3>Valuation</h3><p class=\"sub\">How expensive the shares are</p><div class=\"tiles\">" + tiles.map(function (t) {
        var val = t[2] === "$" ? bigMoney(t[1]) : fmt(t[1], t[3]) + t[2];
        return '<div class="tile"><div class="l">' + esc(t[0]) + '</div><div class="n"' + (t[2] !== "$" ? ' data-count="' + t[1] + '" data-dec="' + t[3] + '" data-suffix="' + t[2] + '"' : "") + ">" + val + '</div><div class="x">' + esc(t[4]) + "</div></div>";
      }).join("") + "</div>" +
        ((d.valuation_history || []).length >= 5 ? '<div style="margin-top:14px">' + lineChart([{ name: "Fwd P/E", color: "var(--s1)", points: d.valuation_history.map(function (h) { return { x: dayName(h.date), y: h.forward_pe }; }) }], { fmtY: function (x) { return fmt(x, 0) + "x"; }, fmtLast: function (x) { return fmt(x, 1) + "x"; }, fmtTip: function (x) { return fmt(x, 1) + "x"; }, label: "Forward P/E history" }) + "</div>"
          : '<div style="margin-top:12px">' + building((d.valuation_history || []).length, 5, "Forward P/E history") + "</div>"));
    }

    // EPS consensus
    var years = ((d.estimates || {}).years || []).filter(function (y) { return isNum(y.eps_avg); });
    if (years.length) {
      var W = 320, H = 190, m = { l: 8, r: 8, t: 26, b: 34 };
      var hiE = Math.max.apply(null, years.map(function (y) { return isNum(y.eps_high) ? y.eps_high : y.eps_avg; })) * 1.08;
      var bw = (W - m.l - m.r) / years.length, yb = function (val) { return H - m.b - (val / hiE) * (H - m.t - m.b); };
      var svg = '<svg class="viz" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Analyst EPS forecasts by fiscal year">';
      svg += '<line class="grid" x1="0" x2="' + W + '" y1="' + (H - m.b) + '" y2="' + (H - m.b) + '"/>';
      years.forEach(function (y, i) {
        var cx = m.l + bw * i + bw / 2, w = Math.min(46, bw * 0.5), top = yb(y.eps_avg), f = fyLabel(y.fiscal_year_end);
        var tipH = "<b>" + esc(f.long) + "</b><br>Average " + money(y.eps_avg) + (isNum(y.eps_low) ? "<br>Range " + money(y.eps_low) + " to " + money(y.eps_high) : "") + (y.analysts_eps ? "<br>" + y.analysts_eps + " analysts" : "");
        svg += '<path d="M' + (cx - w / 2) + "," + (H - m.b) + "V" + (top + 4) + "q0,-4 4,-4H" + (cx + w / 2 - 4) + "q4,0 4,4V" + (H - m.b) + 'Z" fill="var(--s1)" opacity="0.9" data-grow/>';
        if (isNum(y.eps_low) && isNum(y.eps_high)) {
          svg += '<g data-fade><line x1="' + cx + '" x2="' + cx + '" y1="' + yb(y.eps_high) + '" y2="' + yb(y.eps_low) + '" stroke="var(--text)" stroke-width="1.5"/>' +
            '<line x1="' + (cx - 6) + '" x2="' + (cx + 6) + '" y1="' + yb(y.eps_high) + '" y2="' + yb(y.eps_high) + '" stroke="var(--text)" stroke-width="1.5"/>' +
            '<line x1="' + (cx - 6) + '" x2="' + (cx + 6) + '" y1="' + yb(y.eps_low) + '" y2="' + yb(y.eps_low) + '" stroke="var(--text)" stroke-width="1.5"/></g>';
        }
        svg += '<text class="lbl" x="' + cx + '" y="' + (yb(isNum(y.eps_high) ? y.eps_high : y.eps_avg) - 8) + '" text-anchor="middle" data-fade>' + money(y.eps_avg) + "</text>";
        svg += '<text x="' + cx + '" y="' + (H - m.b + 16) + '" text-anchor="middle">' + esc(f.short) + "</text>";
        svg += '<text x="' + cx + '" y="' + (H - m.b + 29) + '" text-anchor="middle" style="font-size:10px;fill:var(--text3)">to ' + esc(f.long.replace("Year to ", "")) + "</text>";
        svg += '<rect x="' + (m.l + bw * i) + '" y="0" width="' + bw + '" height="' + H + '" fill="transparent" data-tip="' + esc(tipH) + '"/>';
      });
      svg += "</svg>";
      var eh = d.eps_history || [];
      html += card("<h3>Earnings per share forecasts</h3><p class=\"sub\">Average analyst forecast per fiscal year. The line shows the lowest to highest forecast.</p>" + svg +
        (isNum(v.forward_eps) ? '<p class="what">Forward EPS used for the forward P/E is ' + money(v.forward_eps) + ", a blend of the next 12 months, not one fiscal year.</p>" : "") +
        '<div style="margin-top:12px">' + (eh.length >= 5 && v.next_fiscal_year_end ? lineChart([{ name: fyLabel(v.next_fiscal_year_end).short, color: "var(--s1)", points: eh.map(function (h) { return { x: dayName(h.date), y: (h.eps || {})[v.next_fiscal_year_end] }; }) }],
          { fmtY: function (x) { return money(x); }, fmtLast: function (x) { return money(x); }, fmtTip: function (x) { return money(x); }, label: "Estimate revisions" }) + (isNum(v.next_year_revision_30d_pct) ? '<p class="what">Change in 30 days: <span class="' + dir(v.next_year_revision_30d_pct) + '">' + pct(v.next_year_revision_30d_pct) + "</span></p>" : "")
          : building(eh.length, 5, "Estimate revision tracking")) + "</div>");
    }

    // Analyst ratings
    var tr = (an.trends || []).slice().sort(function (a, b) { return (a.period || "").localeCompare(b.period || ""); });
    if (tr.length) {

  /* ================= TradingView charts ================= */

  }

      priceLineVisible: false, lastValueVisible: true, crosshairMarkerRadius: 5, crosshairMarkerBorderColor: css("--bg")
    });

    var markers = (d.major_events || []).map(function (e) {

      if (!t || e.date < dates[0]) return null;

      return { time: t, position: "aboveBar", shape: "circle", color: css(e.impact === "positive" ? "--up-mark" : e.impact === "negative" ? "--down-mark" : "--amber-mark"), size: 1.2 };
    }).filter(Boolean).sort(function (a, b) { return a.time < b.time ? -1 : 1; });

  function drawCompare(LW, host) {

    var inp = function (k, l) { var s = sc[k] || {}; return '<div class="scen"><span>' + l + '</span><input inputmode="decimal" placeholder="Value $" data-scen="' + k + '" data-field="value" value="' + esc(s.value || "") + '"><input inputmode="decimal" placeholder="Odds %" data-scen="' + k + '" data-field="prob" value="' + esc(s.prob || "") + '"></div>'; };
    html += card("<h3>Bull, base and bear</h3><p class=\"sub\">What you think one share is worth in each case, and how likely each is</p>" + inp("bull", "Bull") + inp("base", "Base") + inp("bear", "Bear") + '<div id="scenResult" style="margin-top:12px"></div>');
    html += card('<h3>My stop rules</h3><p class="sub">Write down now what would make you stop buying or sell, so fear or excitement does not decide later.</p><textarea id="rules" placeholder="For example: stop buying if gross margin falls below 70% for two quarters."></textarea>');
    html += '<p class="note">Saved on this phone only. The Home Screen app keeps its own copy, separate from Safari.</p>';
    $("plan").innerHTML = html;

    $("dcaAdd").addEventListener("click", function () {
      var a = parseFloat($("dcaAmount").value), p = parseFloat($("dcaPrice").value), dt = $("dcaDate").value;
      if (!isNum(a) || !isNum(p) || a <= 0 || p <= 0 || !dt) { $("dcaAmount").focus(); return; }
      var cur = store("dca:" + t) || []; cur.push({ date: dt, amount: a, price: p });
      cur.sort(function (x, y) { return x.date < y.date ? -1 : 1; }); store("dca:" + t, cur);
      renderPlan(d); setupReveals($("page-plan"));
    });
    $("plan").querySelectorAll("[data-del]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var cur = store("dca:" + t) || []; cur.splice(parseInt(btn.getAttribute("data-del"), 10), 1); store("dca:" + t, cur);
        renderPlan(d); setupReveals($("page-plan"));
      });
    });
    var rules = $("rules"); rules.value = store("rules:" + t) || "";
    rules.addEventListener("input", function () { store("rules:" + t, rules.value); });
    var upd = function () {
      var saved = {};
      $("plan").querySelectorAll("[data-scen]").forEach(function (el) { var k = el.getAttribute("data-scen"); saved[k] = saved[k] || {}; saved[k][el.getAttribute("data-field")] = el.value.trim(); });
      store("scen:" + t, saved);
      var total = 0, w = 0, ok = true;
      ["bull", "base", "bear"].forEach(function (k) { var val = parseFloat(saved[k].value), pr = parseFloat(saved[k].prob); if (!isNum(val) || !isNum(pr)) { ok = false; return; } total += pr; w += val * pr / 100; });
      var out = $("scenResult");
      if (!ok) { out.innerHTML = '<p class="what" style="margin:0">Fill in all six boxes to see your fair value.</p>'; return; }
      if (Math.abs(total - 100) > 0.5) { out.innerHTML = '<p class="what" style="margin:0">Your odds add up to ' + fmt(total, 0) + "%. Make them add up to 100%.</p>"; return; }
      var gap = isNum(price) ? (w / price - 1) * 100 : null;
      out.innerHTML = '<div class="row"><span class="k">Your fair value</span><span class="v">' + money(w) + '</span></div><div class="row"><span class="k">Gap to today\'s price</span><span class="v ' + dir(gap) + '">' + pct(gap, 1) + "</span></div>";
    };
    $("plan").querySelectorAll("[data-scen]").forEach(function (el) { el.addEventListener("input", upd); });
    upd();
  }

  /* ================= Header and freshness ================= */
  function renderHeader(d) {
    var p = d.profile || {}, q = d.quote || {};
    if (p.logo) { $("miniLogo").src = p.logo; $("miniLogo").hidden = false; }
    $("miniTicker").textContent = d.ticker;
    $("miniPrice").innerHTML = isNum(q.price) ? money(q.price) + ' <span class="' + dir(q.change_pct) + '" style="font-size:13px">' + arrow(q.change_pct) + pct(Math.abs(q.change_pct), 2, true) + "</span>" : "";
    var hrs = (Date.now() - (parseDate(d.updated_at) || 0)) / 3600000;
    $("freshDot").className = "dot" + (hrs < 1.5 ? " live" : "");
    $("freshText").textContent = "Updated " + hkt(d.updated_at) + " HKT";
    document.title = d.ticker + " · Tracker";
  }
  function renderPicker() {
    var pk = $("picker");
    if (S.companies.length < 2) { pk.hidden = true; return; }
    pk.hidden = false;
    pk.innerHTML = S.companies.map(function (c) { return '<button data-ticker="' + esc(c.ticker) + '" class="' + (c.ticker === S.ticker ? "on" : "") + '">' + esc(c.ticker) + "</button>"; }).join("");
  }

  function renderAll() {
    var d = S.d;
    setMood(d); renderHeader(d); renderToday(d); renderNews(d); renderOutlook(d); renderNumbers(d);
    if (!(document.activeElement && $("plan").contains(document.activeElement))) renderPlan(d);
    if (S.tab === "numbers") buildCharts();
    setupReveals(document.querySelector(".page.active"));
  }

  /* ================= Motion ================= */
  var triggers = [];
  function setupReveals(page) {
    if (!page) return;
    triggers.forEach(function (t) { t.kill(); }); triggers = [];
    var cards = page.querySelectorAll(".reveal");
    if (!motionOK() || !window.ScrollTrigger) { cards.forEach(function (c) { c.style.opacity = ""; }); return; }
    gsap.registerPlugin(ScrollTrigger); gsap.config({ nullTargetWarn: false });
    cards.forEach(function (c) { if (!c.dataset.shown) prepInner(c); });
    if (S.quiet) { cards.forEach(function (c) { c.dataset.shown = "1"; }); return; }
    var fresh = Array.prototype.filter.call(cards, function (c) { return !c.dataset.shown; });
    gsap.set(fresh, { opacity: 0, y: 34, scale: 0.97, filter: "blur(8px)" });
    triggers = ScrollTrigger.batch(fresh, {
      start: "top 94%", once: true,
      onEnter: function (batch) {
        gsap.to(batch, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.9, stagger: 0.08, ease: "expo.out", clearProps: "filter,transform" });
        batch.forEach(function (c, i) { c.dataset.shown = "1"; playInner(c, 0.15 + i * 0.08); });
      }
    });
    ScrollTrigger.refresh();
  }
  function prepInner(c) {
    gsap.set(c.querySelectorAll("[data-draw]"), { strokeDasharray: 1, strokeDashoffset: 1 });
    gsap.set(c.querySelectorAll("[data-grow]"), { scaleY: 0, transformOrigin: "50% 100%", transformBox: "fill-box" });
    gsap.set(c.querySelectorAll("[data-growx]"), { scaleX: 0, transformOrigin: "0% 50%" });
    gsap.set(c.querySelectorAll("[data-pop]"), { scale: 0, transformOrigin: "50% 50%", transformBox: "fill-box" });
    gsap.set(c.querySelectorAll("[data-fade]"), { opacity: 0 });
    gsap.set(c.querySelectorAll("[data-slide]"), { left: "0%" });
  }
  function playInner(c, delay) {
    gsap.to(c.querySelectorAll("[data-draw]"), { strokeDashoffset: 0, duration: 1.6, ease: "power2.inOut", delay: delay, stagger: 0.15 });
    gsap.to(c.querySelectorAll("[data-grow]"), { scaleY: 1, duration: 1.1, ease: "expo.out", delay: delay, stagger: 0.07 });
    gsap.to(c.querySelectorAll("[data-growx]"), { scaleX: 1, duration: 1.1, ease: "expo.out", delay: delay, stagger: 0.08 });
    gsap.to(c.querySelectorAll("[data-pop]"), { scale: 1, duration: 0.7, ease: "back.out(2.2)", delay: delay + 0.35, stagger: 0.05 });
    gsap.to(c.querySelectorAll("[data-fade]"), { opacity: 1, duration: 0.6, ease: "power1.out", delay: delay + 0.6 });
    c.querySelectorAll("[data-slide]").forEach(function (el) { gsap.to(el, { left: el.getAttribute("data-slide") + "%", duration: 1.4, ease: "expo.out", delay: delay }); });
    c.querySelectorAll("[data-count]").forEach(function (el) {
      var target = parseFloat(el.getAttribute("data-count")); if (!isNum(target)) return;
      var dec = parseInt(el.getAttribute("data-dec") || "0", 10), suf = el.getAttribute("data-suffix") || "", o = { v: 0 }, keep = el.textContent;
      if (isNaN(parseFloat(keep.replace(/[$,]/g, "")))) return;
      gsap.to(o, { v: target, duration: 1.3, ease: "power3.out", delay: delay, onUpdate: function () { el.textContent = fmt(o.v, dec) + suf; }, onComplete: function () { el.textContent = keep; } });
    });
  }

  /* ================= Scroll effects: collapsing hero, parallax glow, shrinking dock ================= */
  var lastY = 0, ticking = false, aurora = $("aurora"), dock = $("dock");
  function onScroll() {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () {
      var y = window.scrollY, pv = Math.max(0, Math.min(1, y / 140));
      document.documentElement.style.setProperty("--p", reduceMotion.matches ? (y > 60 ? 1 : 0) : pv.toFixed(3));
      if (!reduceMotion.matches) aurora.style.transform = "translate3d(0," + (-y * 0.18).toFixed(1) + "px,0)";
      if (y > lastY + 6 && y > 120) dock.classList.add("small"); else if (y < lastY - 6 || y < 60) dock.classList.remove("small");
      lastY = y; ticking = false;
    });
  }
  window.addEventListener("scroll", onScroll, { passive: true });

  /* ================= Tabs ================= */
  function movePill() {
    var btn = dock.querySelector('button[data-tab="' + S.tab + '"]'), pill = $("pill");
    if (!btn) return;
    pill.style.width = btn.offsetWidth + "px";
    pill.style.transform = "translateX(" + (btn.offsetLeft - 6) + "px)";
  }
  function showTab(name, opts) {
    opts = opts || {};
    if (TABS.indexOf(name) < 0) name = "today";
    var prev = S.tab, dirn = TABS.indexOf(name) - TABS.indexOf(prev);
    S.scroll[prev] = window.scrollY;
    S.tab = name;
    document.querySelectorAll(".page").forEach(function (p) { p.classList.toggle("active", p.getAttribute("data-tab") === name); });
    dock.querySelectorAll("button").forEach(function (b) { if (b.getAttribute("data-tab") === name) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    movePill();
    if (history.replaceState) history.replaceState(null, "", "#" + name);
    window.scrollTo(0, opts.keepTop ? 0 : (S.scroll[name] || 0));
    var page = document.querySelector(".page.active");
    if (name === "numbers" && S.d) buildCharts();
    if (prev !== name && motionOK()) gsap.fromTo(page, { opacity: 0, x: dirn > 0 ? 28 : -28 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out", clearProps: "transform" });
    if (S.d) setupReveals(page);
    onScroll();
  }
  dock.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) showTab(b.getAttribute("data-tab")); });
  window.addEventListener("resize", movePill);

  function openStory(key) {
    showTab("news", { keepTop: true });
    if (S.topic !== "all") { S.topic = "all"; document.querySelectorAll("#topicChips button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-topic") === "all"); }); applyTopic(false); }
    var el = document.getElementById("story-" + key); if (!el) return;
    el.classList.add("open"); el.querySelector("[data-toggle]").setAttribute("aria-expanded", "true");
    setTimeout(function () {
      var top = el.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({ top: top, behavior: reduceMotion.matches ? "auto" : "smooth" });
      if (motionOK()) gsap.fromTo(el, { backgroundColor: "color-mix(in oklab, var(--mood) 18%, transparent)" }, { backgroundColor: "rgba(0,0,0,0)", duration: 1.6, ease: "power2.out", clearProps: "backgroundColor" });
    }, 120);
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-toggle]");
    if (t) { var st = t.closest(".story"); var open = st.classList.toggle("open"); t.setAttribute("aria-expanded", open ? "true" : "false"); return; }
    var s = e.target.closest("[data-story]"); if (s) { openStory(s.getAttribute("data-story")); return; }
    var g = e.target.closest("[data-goto]"); if (g) { showTab(g.getAttribute("data-goto"), { keepTop: true }); return; }
    var tp = e.target.closest("#topicChips button");
    if (tp) { S.topic = tp.getAttribute("data-topic"); document.querySelectorAll("#topicChips button").forEach(function (b) { b.classList.toggle("on", b === tp); }); applyTopic(true); return; }
    var rg = e.target.closest("#rangeSeg button");
    if (rg) { S.range = rg.getAttribute("data-range"); document.querySelectorAll("#rangeSeg button").forEach(function (b) { b.classList.toggle("on", b === rg); }); S.built.numbers = false; buildCharts(); return; }
    var pk = e.target.closest("#picker button");
    if (pk && pk.getAttribute("data-ticker") !== S.ticker) { S.ticker = pk.getAttribute("data-ticker"); store("ticker", S.ticker); renderPicker(); load(); return; }
    if (e.target.closest(".tip") || (S.pendingStory && e.target.closest("#priceChart") === null && tip.classList.contains("show"))) { /* nothing */ }
  });
  tip.addEventListener("click", function () { if (S.pendingStory) { var k = S.pendingStory; S.pendingStory = null; hideTip(); openStory(k); } });

  /* ================= Gestures: swipe between tabs, pull to refresh ================= */
  var touch = null, ptr = $("ptr"), pulling = 0;
  $("main").addEventListener("touchstart", function (e) {
    if (e.target.closest(".chart-host, input, textarea, .chips, .seg, svg.viz")) { touch = null; return; }
    touch = { x: e.touches[0].clientX, y: e.touches[0].clientY, top: window.scrollY <= 0 };
  }, { passive: true });
  $("main").addEventListener("touchmove", function (e) {
    if (!touch || !touch.top || S.loading) return;
    var dy = e.touches[0].clientY - touch.y, dx = Math.abs(e.touches[0].clientX - touch.x);
    if (dy > 0 && dy > dx) {
      pulling = Math.min(110, dy * 0.5);
      ptr.style.opacity = Math.min(1, pulling / 60);
      ptr.style.transform = "translateY(" + (pulling - 30) + "px) rotate(" + pulling * 3 + "deg)";
    }
  }, { passive: true });
  $("main").addEventListener("touchend", function (e) {
    if (!touch) return;
    var dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
    touch = null;
    if (pulling > 70) { refresh(); }
    else { ptr.style.opacity = 0; ptr.style.transform = ""; }
    pulling = 0;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 50) return;
    var i = TABS.indexOf(S.tab) + (dx < 0 ? 1 : -1);
    if (i >= 0 && i < TABS.length) showTab(TABS[i]);
  }, { passive: true });
  function refresh() {
    ptr.classList.add("spin"); ptr.style.opacity = 1; ptr.style.transform = "translateY(10px)";
    load(true).then(function () { setTimeout(function () { ptr.classList.remove("spin"); ptr.style.opacity = 0; ptr.style.transform = ""; }, 400); });
  }

  /* ================= Loading ================= */
  function load(force) {
    S.loading = true;
    return fetch("data/" + encodeURIComponent(S.ticker) + ".json?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("No data file yet for " + S.ticker + "."); return r.json(); })
      .then(function (d) {
        var first = !S.d || S.d.ticker !== d.ticker;
        if (!first && !force && d.updated_at === S.d.updated_at) return;
        S.d = d; if (first) S.baseline = computeBaseline(d);
        S.quiet = !first && !force;
        renderAll();
        S.quiet = false;
      })
      .catch(function (err) {
        $("freshText").textContent = "Offline";
        if (!S.d) $("today").innerHTML = card('<h3>Could not load the data</h3><p class="sub" style="margin:0">' + esc(err.message) + " Pull down to try again.</p>");
      })
      .then(function () { S.loading = false; });
  }
  function start() {
    fetch("config/companies.json?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : { companies: [] }; })
      .catch(function () { return { companies: [] }; })
      .then(function (cfg) {
        S.companies = cfg.companies || [];
        var tickers = S.companies.map(function (c) { return c.ticker; });
        var fromUrl = new URLSearchParams(location.search).get("t");
        S.ticker = [fromUrl, store("ticker"), tickers[0], "NVDA"].filter(function (x) { return x && (!tickers.length || tickers.indexOf(x) >= 0); })[0];
        renderPicker();
        var h = (location.hash || "").replace("#", "");
        if (TABS.indexOf(h) >= 0 && h !== "today") showTab(h);
        movePill();
        return load();
      });
  }

  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.ticker && !S.loading) load(); });
  setInterval(function () { if (!document.hidden && S.ticker && !S.loading) load(); }, 5 * 60 * 1000);
  darkQuery.addEventListener("change", function () { document.documentElement.classList.toggle("dark", darkQuery.matches); if (S.d) { S.built.numbers = false; if (S.tab === "numbers") buildCharts(); } });
  reduceMotion.addEventListener("change", function () { if (S.d) renderAll(); });
  start();
});
</script>
</body>
</html>
