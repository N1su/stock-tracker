name: Update stock data

on:
  schedule:
    # Times are UTC. Hong Kong is UTC+8.
    # US trading hours, every 30 minutes, Monday to Friday (9pm to 5:30am Hong Kong).
    - cron: "*/30 13-21 * * 1-5"
    # Outside trading hours, every 2 hours, every day (news and the brief only).
    - cron: "15 0-12/2,22 * * *"
    # Weekend daytime in the US, three extra news checks.
    - cron: "15 14,17,20 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the repository files
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run update script
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          HKBU_GENAI_API_KEY: ${{ secrets.HKBU_GENAI_API_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python scripts/update.py

      - name: Save the new data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi
          git commit -m "Update stock data"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push failed, trying again in 10 seconds."
            sleep 10
          done
          exit 1
